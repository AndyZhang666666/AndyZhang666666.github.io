<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f5ef"><title>安心装修 · 家具选购手记</title>
<style>
:root{color-scheme:light;--paper:#f7f5ef;--ink:#292e29;--muted:#5d655a;--rule:#cbcbbd;--dark:#273e33;--rust:#884a32;font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}body{margin:0}main,.bar{max-width:1120px;margin:auto;padding:0 32px}.bar{display:flex;justify-content:space-between;align-items:center;min-height:68px;border-bottom:1px solid var(--rule)}a{color:var(--dark);text-underline-offset:4px}h1,h2,h3,p{margin:0}h1,h2,h3,.big{font-family:Georgia,"Songti SC",SimSun,serif}h1{font-size:clamp(32px,4.5vw,58px);line-height:1.12;letter-spacing:-.04em}h2{font-size:clamp(24px,3vw,34px);line-height:1.28}h3{font-size:20px}.intro{padding:34px 0 22px;display:flex;gap:24px;align-items:end;justify-content:space-between}.intro p{max-width:32em;color:var(--muted)}.spread{display:grid;grid-template-columns:1.05fr 1fr;gap:32px;align-items:start}.planbox,.choices,.record,.details{border:1px solid var(--rule);background:#fffdf7;padding:22px}.planbox{background:#e7e8dc}.eyebrow{font-size:13px;font-weight:650;letter-spacing:.09em;color:var(--muted)}.drawing{isolation:isolate;position:relative;aspect-ratio:1.53;margin:18px 0 12px;background:repeating-linear-gradient(0deg,transparent 0 20px,#7c8a6d18 21px 22px),#f0efdf;border:6px double #626951;border-left-width:10px}.drawing:before{content:"";position:absolute;left:8%;right:42%;top:-7px;height:7px;background:#d8e7df;border:1px solid #748d83}.drawing:after{content:"";position:absolute;bottom:-7px;left:61%;width:17%;height:9px;background:#e7e8dc}.rug{position:absolute;inset:18% 47% 16% 5%;border:1px solid #a9a891;background:repeating-linear-gradient(90deg,#ddd8bd 0 3px,#e4dfc8 4px 6px);border-radius:4px}.coffee{position:absolute;left:22%;top:55%;width:15%;height:15%;border-radius:48%;background:#ac8463;border:2px solid #775a44}.buffet{position:absolute;right:4%;bottom:4%;width:27%;height:9%;background:#b49472;border:2px solid #8d765e}.plant{position:absolute;left:4%;top:5%;width:7%;aspect-ratio:1;border-radius:50%;background:radial-gradient(ellipse at 60% 32%,#99a98a 20%,#72866c 70%);border:2px solid #68785d}.spot{position:absolute;cursor:pointer;z-index:1;background:#cfc4a5;border:2px solid #877959;color:#282c23;font:inherit;min-height:44px;padding:0;display:grid;place-items:center}.spot span{background:#fffdf1;padding:4px 10px;border:1px solid #aaab95;border-radius:18px;font-size:14px;font-weight:650}.spot[aria-pressed=true]{outline:3px solid #395444;outline-offset:4px}.spot[aria-pressed=true] span{background:var(--dark);color:white}.sofa{left:11%;top:22%;width:35%;height:23%;border-radius:9px;background:linear-gradient(90deg,transparent 32%,#9d9278 33%,transparent 34% 65%,#9d9278 66%,transparent 67%),#c2b79c;box-shadow:inset 0 6px #b3a68c,inset 6px 0 #b3a68c,inset -6px 0 #b3a68c}.table{right:12%;top:29%;width:22%;height:31%;background:#b89168;border-radius:25%;box-shadow:0 -10px 0 -3px #9c8e73,0 10px 0 -3px #9c8e73}.note,small{font-size:14px;color:var(--muted)}.choices h2{margin:4px 0 12px}.candidate{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;margin:8px 0;padding:12px 14px;border:1px solid var(--rule);border-radius:4px;background:#fffdf8;color:var(--ink);font:inherit;cursor:pointer}.candidate[aria-pressed=true]{border:2px solid var(--dark);padding:11px 13px;background:#edf1e7}.candidate small{display:block}.money{font-variant-numeric:tabular-nums;font-weight:650}.result{border-left:3px solid var(--rust);padding-left:14px;margin:17px 0 4px}.result p{margin-top:4px}.details,.record{margin-top:20px}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:16px 0}.field label{display:block;font-weight:650}.field input{font:inherit;background:white;color:var(--ink);border:1px solid #899081;border-radius:4px;min-height:46px;width:100%;margin:5px 0;padding:6px 10px}.actions,.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.action,.secondary{font:inherit;font-weight:600;min-height:44px;cursor:pointer;padding:9px 16px;border-radius:4px;border:1px solid var(--dark)}.action{background:var(--dark);color:white}.secondary{background:transparent;color:var(--dark)}:focus-visible{outline:3px solid #91602f;outline-offset:3px}.record ul{padding-left:22px;margin:10px 0}.foot{border-top:1px solid var(--rule);margin:26px 0;padding:18px 0;justify-content:space-between;font-size:14px}.status{min-height:1.6em;color:var(--dark);margin-top:8px}.minor{font-size:14px}.saved{border-top:1px solid var(--rule);padding-top:12px;margin-top:14px;white-space:pre-line}.saved:empty{display:none}button:disabled{opacity:.55;cursor:default}@media(max-width:740px){main,.bar{padding-inline:16px}.bar{min-height:52px}.intro{display:block;padding:20px 0 14px}.intro p{margin-top:8px}.spread{grid-template-columns:1fr;gap:12px}.planbox,.choices,.record,.details{padding:15px}.drawing{aspect-ratio:1.95;margin:12px 0}.inputs{gap:12px}.details,.record{margin-top:12px}}@media(max-width:420px){.inputs{grid-template-columns:1fr}.sofa{top:20%}.intro p,.candidate{font-size:15px}}
</style>
</head><body>
<header class="bar"><a href="https://andyzhang666666.github.io/#project-renovation">← 个人作品集</a><strong>安心装修</strong></header>
<main><div class="intro"><h1>这件家具，家里放得下吗？</h1><p>先点图上的位置，再把店里看中的两款放在一起比。<br><small>虚构客餐厅与报价 · 本机离线演示</small></p></div>
<div class="spread"><section class="planbox" aria-label="可点选的客餐厅示意图"><p class="eyebrow">客餐厅平面 · 示意图</p><div class="drawing"><i class="rug"></i><i class="coffee"></i><i class="buffet"></i><i class="plant"></i><button class="spot sofa" data-room="sofa" aria-pressed="true"><span>沙发</span></button><button class="spot table" data-room="table" aria-pressed="false"><span>餐桌</span></button></div><p class="note" id="planNote"></p></section>
<section class="choices"><p class="eyebrow">商品卡 · 虚构报价</p><h2 id="choiceTitle"></h2><div id="options"></div><div class="result" aria-live="polite"><h3 id="verdict"></h3><p id="reason"></p></div></section></div>
<section class="details"><h2>把没问清的两件事补上</h2><div class="inputs"><div class="field"><label for="space" id="spaceLabel"></label><input type="number" inputmode="decimal" id="space" min="1" max="999" step="0.1" placeholder="还没复尺"><small id="spaceHelp"></small></div><div class="field"><label for="fee">这款的送装合计（元）</label><input type="number" inputmode="decimal" id="fee" min="0" max="99999" step="0.01" placeholder="商家还没确认"><small>含上楼、搬运与安装。确认免费时填 0。</small></div></div><div class="actions"><button class="secondary" id="example">试填示例回复</button><button class="secondary" id="clear">清除本款送装费</button></div></section>
<section class="record"><p class="eyebrow">给家人的交接单</p><h2 id="next"></h2><ul id="list"></ul><div class="actions"><button class="action" id="save">保存这张交接单</button><button class="secondary" id="export">导出为文本</button></div><p class="saved" id="saved"></p><p class="status" role="status" id="status"></p></section>
<footer class="foot"><span>演示数据仅用于比较，进门、转角和现场安装需另行核实。</span><a id="download" href="./index.html" download="安心装修-离线版.html">下载离线版 HTML</a><a href="https://github.com/AndyZhang666666/AndyZhang666666.github.io/tree/main/renovation">源码与迭代</a></footer>
<noscript>请启用 JavaScript 以比较家具并保存交接单。</noscript></main>
<script>
'use strict';
const rooms={
 sofa:{name:'沙发',label:'可摆沙发的净长（厘米）',help:'扣除家里想留的边几位置，只量实际可摆的一段。',note:'客厅靠窗一侧留给边几，复尺时要从可用位置的边缘开始量。',measured:246,items:[{name:'云棉三人位',width:240,price:3680,exampleFee:220},{name:'弧背宽座',width:260,price:3490,exampleFee:380}]},
 table:{name:'餐桌',label:'预留拉椅空间后的净宽（厘米）',help:'沿桌面短边量。先留出你家希望保留的拉椅与通行位置。',note:'餐桌旁边有餐边柜，先拉开椅子走一遍，再量剩给桌面的宽度。',measured:86,items:[{name:'木作方桌',width:80,price:2180,exampleFee:0},{name:'圆角宽桌',width:95,price:1990,exampleFee:160}]}
};
const key='andy.renovation.demo.v1', el=id=>document.getElementById(id);
const blank=()=>({room:'sofa',sofa:{pick:0,space:'',fees:['',''],saved:''},table:{pick:0,space:'',fees:['',''],saved:''}});
function numeric(v,min,max,precision){if(typeof v!=='string'||v.trim()==='')return null;const n=Number(v);return Number.isFinite(n)&&n>=min&&n<=max&&Math.abs(n*precision-Math.round(n*precision))<0.00001?n:null}
function restore(){const fresh=blank();try{const obj=JSON.parse(localStorage.getItem(key));if(!obj)return fresh;
 for(const id of Object.keys(rooms)){const src=obj[id],d=fresh[id];if(!src)continue;d.pick=src.pick===1?1:0;if(numeric(src.space,1,999,10)!==null)d.space=src.space;d.fees=d.fees.map((_,i)=>numeric(src.fees?.[i],0,99999,100)!==null?src.fees[i]:'');if(typeof src.saved==='string')d.saved=src.saved.slice(0,1600)}
 if(Object.hasOwn(rooms,obj.room))fresh.room=obj.room;
 }catch{}return fresh}
let state=restore();function persist(){try{localStorage.setItem(key,JSON.stringify(state));return true}catch{return false}}
function decision(room,d){const item=room.items[d.pick],space=numeric(d.space,1,999,10),fee=numeric(d.fees[d.pick],0,99999,100);
 const gap=space===null?null:Math.round((space-item.width)*10)/10;
 const title=gap===null?'先量摆放位置':gap<0?'这款超出可用尺寸':fee===null?'尺寸初筛通过，送装费待问':'尺寸和送装金额已核清';
 const cost=fee===null?'商品标价 ¥'+item.price+'，送装待确认，到家总价待定。':'商品 ¥'+item.price+' ＋ 送装 ¥'+fee+' ＝ 到家 ¥'+Number((item.price+fee).toFixed(2))+'。';
 const fit=gap===null?'可用尺寸还没量，商品需要 '+item.width+' 厘米。':gap<0?'位置 '+space+' 厘米，商品 '+item.width+' 厘米，超出 '+(-gap)+' 厘米。':'位置 '+space+' 厘米，商品 '+item.width+' 厘米，余量 '+gap+' 厘米。';
 const next=gap===null?'下一步：请家人现场复尺':gap<0?'下一步：换一款，或重新确认摆位':fee===null?'下一步：问商家送装一共多少钱':'下一步：带交接单确认搬入路线';
 const ask=gap===null?room.help:gap<0?'先保留原摆位，比较另一款的尺寸。':fee===null?'请商家写清上楼、搬运、安装的合计费用。':'请家人和商家再确认门洞、电梯及转角后决定。';
 return {title,cost,fit,next,ask,text:[room.name+' · '+item.name,title,fit,cost,next,ask].join('\n')}}
function render(rebuild=true){const room=rooms[state.room],d=state[state.room],out=decision(room,d);
 if(rebuild){document.querySelectorAll('[data-room]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.room===state.room)));el('planNote').textContent=room.note;el('choiceTitle').textContent='选一款'+room.name+'，看看条件';el('spaceLabel').textContent=room.label;el('spaceHelp').textContent=room.help;el('space').value=d.space;el('fee').value=d.fees[d.pick];el('options').replaceChildren();
 room.items.forEach((it,i)=>{const b=document.createElement('button');b.className='candidate';b.setAttribute('aria-pressed',String(i===d.pick));const label=document.createElement('span'),sub=document.createElement('small'),price=document.createElement('span');label.textContent=it.name;sub.textContent=(state.room==='sofa'?'沙发总长 ':'桌面宽 ')+it.width+' 厘米';label.append(sub);price.className='money';price.textContent='¥'+it.price;b.append(label,price);b.onclick=()=>{d.pick=i;persist();el('status').textContent='';render();el('options').children[i].focus({preventScroll:true})};el('options').append(b)})}
 el('verdict').textContent=out.title;el('reason').textContent=out.fit;el('next').textContent=out.next;el('list').replaceChildren(...[out.fit,out.cost,out.ask].map(s=>{const li=document.createElement('li');li.textContent=s;return li}));el('saved').textContent=d.saved?'上次保存的交接单\n'+d.saved:'';el('clear').disabled=d.fees[d.pick]==='';
 const invalid=!el('space').validity.valid||!el('fee').validity.valid;el('save').disabled=el('export').disabled=invalid}
document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{state.room=b.dataset.room;persist();el('status').textContent='';render()});
for(const id of ['space','fee'])el(id).oninput=()=>{const d=state[state.room];if(id==='space')d.space=el(id).value;else d.fees[d.pick]=el(id).value;const saved=persist();render(false);el('status').textContent=!el(id).validity.valid?'请检查输入范围及小数位数。':saved?'':'此浏览器未保存草稿，可导出文本。'};
el('example').onclick=()=>{const r=rooms[state.room],d=state[state.room];d.space=String(r.measured);d.fees[d.pick]=String(r.items[d.pick].exampleFee);persist();render();el('status').textContent='已填入虚构示例，可自行修改。'};
el('clear').onclick=()=>{const d=state[state.room];d.fees[d.pick]='';persist();render();el('status').textContent='此款送装费已改回待确认。'};
el('save').onclick=()=>{const d=state[state.room];d.saved=decision(rooms[state.room],d).text;const ok=persist();render(false);el('status').textContent=ok?'已保存到此浏览器，刷新后可查看。':'已暂存在本页；请导出文本留存。'};
el('export').onclick=()=>{const r=rooms[state.room],d=state[state.room],a=document.createElement('a'),url=URL.createObjectURL(new Blob(['安心装修 · 示例交接单\n'+decision(r,d).text],{type:'text/plain;charset=utf-8'}));a.href=url;a.download='安心装修-'+r.name+'交接单.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);el('status').textContent='已生成当前条件的文本交接单。'};
if(location.protocol==='file:')el('download').hidden=true;
render();
</script></body></html>
