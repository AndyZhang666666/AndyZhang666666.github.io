<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>官网主版本与当前线上 · 对照</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;height:100dvh;display:flex;flex-direction:column;font:14px/1.5 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#232624;background:#f0f1ed}
    .toolbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:12px 20px;border-bottom:1px solid #c9cec4}
    .toolbar h1{font-size:16px;line-height:1.4;margin:0;font-weight:600}
    .toolbar p{font-size:12px;color:#5c635a;margin:3px 0 0}
    .project-picker{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:13px}
    button,select,a{font:inherit;color:inherit}
    button,select{min-height:44px;border:1px solid #bac2b3;border-radius:2px;padding:8px 12px;background:transparent}
    button{cursor:pointer;transition:background .15s,color .15s}
    button:hover{background:#e4e8de}
    button[aria-pressed=true]{background:#263e29;color:#fff;border-color:#263e29}
    button:active{transform:translateY(1px)}
    :focus-visible{outline:2px solid #245544;outline-offset:3px}
    .view-switch{display:flex;gap:5px;flex-wrap:wrap}
    .compare{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:minmax(0,1fr);gap:1px;background:#c9cec4}
    .pane{display:flex;flex-direction:column;min-width:0;min-height:0;background:#fff}
    .pane-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid #d9ddd5}
    .pane-head h2{font-size:14px;font-weight:600;line-height:1.4;margin:0}
    .pane-head p{font-size:12px;color:#5c635a;overflow-wrap:anywhere;margin:4px 0 0}
    .pane-head a{flex-shrink:0;min-height:44px;display:flex;align-items:center;text-underline-offset:4px;font-size:13px}
    iframe{display:block;width:100%;flex:1;min-height:0;border:0;background:#f5f4ef}
    .compare[data-view=local],.compare[data-view=live]{grid-template-columns:minmax(0,1fr)}
    .compare[data-view=local] .pane-live,.compare[data-view=live] .pane-local{display:none}
    @media(max-width:1000px){.toolbar{padding:10px 12px;gap:10px 16px}.toolbar h1{font-size:15px}.view-switch{width:100%}.view-switch button{flex:1;padding-inline:9px;font-size:13px}.compare[data-view=split]{grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(2,minmax(0,1fr))}.pane-head{padding:8px 12px}.pane-head a{font-size:12px}}
    @media(max-width:520px){.project-picker{margin-left:0}.project-picker span{display:none}.project-picker select{max-width:145px}.toolbar{justify-content:space-between}.toolbar p{font-size:11px}.pane-head h2{font-size:13px}.pane-head p{font-size:11px}}
    @media(prefers-reduced-motion:reduce){button{transition:none}button:active{transform:none}}
  </style>
</head>
<body>
  <header class="toolbar">
    <div><h1>本地主版本 / 线上官网</h1><p>同一官网的本地与线上对照 · 发布后两边显示同版</p></div>
    <label class="project-picker"><span>查看</span><select id="project" aria-label="选择对照项目"><option value="/">个人官网</option><option value="/#selected">精选互动（本轮新增）</option><option value="/#projects">完整作品库</option><option value="/llm-output-eval/">Eval Lab</option><option value="/tasteroom/">偏爱实验室</option><option value="/demos/filing-eval/">Filing Eval</option><option value="/suibianju/">随便局</option><option value="/bundle-lab/">Bundle Lab</option></select></label>
    <div class="view-switch" role="group" aria-label="对照视图">
      <button type="button" data-view="split" aria-pressed="false">并排对照</button>
      <button type="button" data-view="local" aria-pressed="true">只看主版本</button>
      <button type="button" data-view="live" aria-pressed="false">只看线上</button>
    </div>
  </header>
  <main class="compare" id="comparison" data-view="local" aria-label="官网主版本与当前线上网站对照">
    <section class="pane pane-local" aria-label="官网主版本，当前本地工作目录">
      <header class="pane-head"><div><h2>本地主版本 · 当前工作目录</h2><p id="localSource">127.0.0.1:8811/</p></div><a id="openLocal" href="/" target="_blank" rel="noopener">单独打开 ↗</a></header>
      <iframe id="localFrame" src="/" title="官网主版本（当前本地工作目录）"></iframe>
    </section>
    <section class="pane pane-live" aria-label="当前线上版本，直接加载 GitHub Pages">
      <header class="pane-head"><div><h2>当前线上版本 · GitHub Pages</h2><p id="liveSource">andyzhang666666.github.io/</p></div><a id="openLive" href="https://andyzhang666666.github.io/" target="_blank" rel="noopener">单独打开 ↗</a></header>
      <iframe id="liveFrame" src="https://andyzhang666666.github.io/" title="当前线上版本（直接来自 GitHub Pages）" referrerpolicy="no-referrer"></iframe>
    </section>
  </main>
  <script>
    const comparison=document.querySelector('#comparison');
    function changeView(view){
      comparison.dataset.view=view;
      document.querySelectorAll('[data-view]').forEach(button=>{if(button.tagName==='BUTTON')button.setAttribute('aria-pressed',String(button.dataset.view===view))});
    }
    function changeProject(){
      const path=document.querySelector('#project').value;
      const local=path+(path==='/tasteroom/'?'?direction=swiss':'');
      const live=new URL(path,'https://andyzhang666666.github.io/').href;
      document.querySelector('#localFrame').src=local;
      document.querySelector('#liveFrame').src=live;
      document.querySelector('#openLocal').href=local;
      document.querySelector('#openLive').href=live;
      document.querySelector('#localSource').textContent='127.0.0.1:8811'+local;
      document.querySelector('#liveSource').textContent=live.replace('https://','');
    }
    document.querySelector('#project').addEventListener('change',changeProject);
    document.querySelectorAll('button[data-view]').forEach(button=>button.addEventListener('click',()=>changeView(button.dataset.view)));
    const start=new URLSearchParams(location.search).get('section');
    if(start==='selected'||start==='projects'){document.querySelector('#project').value='/#'+start;changeProject();}
    changeView(matchMedia('(min-width:1001px)').matches?'split':'local');
  </script>
</body>
</html>
