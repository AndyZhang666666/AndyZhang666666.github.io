<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>原版与更新版 · 本地对照</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#232624;background:#f0f1ed}header{min-height:64px;padding:10px 20px;display:flex;gap:8px;align-items:center}strong{margin-right:auto}small{font-weight:400;color:#61635e;margin-left:12px}button,a,select{font:inherit;color:inherit}button,select{min-height:40px;padding:6px 14px;border:1px solid #bfc5b9;background:transparent;border-radius:2px}button{cursor:pointer}button[aria-pressed=true]{background:#262a27;color:#fff;border-color:#262a27}a{margin-left:12px;text-underline-offset:4px}:focus-visible{outline:2px solid #245544;outline-offset:3px}iframe{width:100%;height:calc(100dvh - 64px);border:0;display:block}label{display:flex;align-items:center;gap:8px;font-size:12px}@media(max-width:700px){header{padding:8px 12px;gap:6px;flex-wrap:wrap}strong{font-size:12px}small{display:none}label{margin-left:auto}label span{display:none}select{max-width:155px}button{padding:6px 12px}a{margin-left:auto;font-size:12px}iframe{height:calc(100dvh - 104px)}}
</style></head>
<body><header><strong>本地对照<small>官网原版设计保留 · 未上传</small></strong><label><span>查看</span><select id="project" aria-label="选择对照项目"><option value="/">个人官网</option><option value="/llm-output-eval/">Eval Lab</option><option value="/tasteroom/">偏爱实验室</option><option value="/demos/filing-eval/">Filing Eval</option><option value="/suibianju/">随便局</option><option value="/bundle-lab/">Bundle Lab</option></select></label><button data-version="new" aria-pressed="true">更新版</button><button data-version="original" aria-pressed="false">原版</button><a id="open" href="/" target="_blank" rel="noopener">单独打开 ↗</a></header><iframe src="/" title="原版与更新版对照"></iframe><script>
let version='new';function update(){const path=document.querySelector('#project').value;const src=version==='original'?'http://127.0.0.1:8812'+path:path+(path==='/tasteroom/'?'?direction=swiss':'');document.querySelector('iframe').src=src;document.querySelector('#open').href=src;document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.version===version)))}document.querySelector('#project').onchange=update;document.querySelectorAll('button').forEach(b=>b.onclick=()=>{version=b.dataset.version;update()});
</script></body></html>
