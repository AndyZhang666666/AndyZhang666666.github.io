<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>作品桌 · 新旧对照</title><style>*{box-sizing:border-box}body{margin:0;background:#f3efe5;color:#25271f;font:15px/1.5 -apple-system,'PingFang SC',sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:9px 18px;border-bottom:1px solid #aaa48e}h1{font:600 19px Georgia,'Songti SC',serif;margin:0}nav,.routes{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,select{font:inherit;padding:.35rem .55rem;color:inherit;background:transparent;border:1px solid #bcb7a9;cursor:pointer}button[aria-pressed=true]{background:#352e25;color:#fff}a{color:#685333;text-underline-offset:3px}main{display:flex;height:calc(100dvh - 105px);min-height:420px}figure{margin:0;min-width:0;flex:1;display:flex;flex-direction:column}figure[hidden]{display:none}figcaption{font-size:12px;padding:4px 16px;border-bottom:1px solid #c9c4b6}iframe{flex:1;min-height:0;width:100%;border:0}figure+figure{border-left:1px solid #aca18f}.routes{font-size:13px;padding:5px 18px;gap:15px}@media(max-width:700px){header{gap:6px;padding:6px 10px}.routes{padding:5px 10px}main.split{flex-direction:column;height:140dvh}main{height:calc(100dvh - 140px)}button,select{min-height:40px}h1{font-size:16px}}</style></head><body><header><h1>作品桌 · 本地审阅</h1><nav aria-label="对照方式"><button data-mode="new" aria-pressed="true">候选版</button><button data-mode="old" aria-pressed="false">已发布底稿</button><button data-mode="both" aria-pressed="false">并排</button><select id="section" aria-label="对照章节"><option value="">首屏</option><option value="#selected">四个精选</option><option value="?present=1#selected">90 秒投屏</option><option value="#education">两张研究图</option><option value="#projects">作品库</option><option value="#jd">按任务找证据</option></select></nav></header><nav class="routes" aria-label="独立打开"><a href="/" target="_blank">打开候选官网 ↗</a><a href="/studio/menu/" target="_blank">搜索对照 ↗</a><a href="/studio/script/" target="_blank">改一场戏 ↗</a><a href="/studio/credits/" target="_blank">制作账本 ↗</a><a href="https://AndyZhang666666.github.io/" target="_blank">线上官网 ↗</a></nav><main><figure><figcaption>本地候选</figcaption><iframe id="new" src="/" title="本地候选网站"></iframe></figure><figure hidden><figcaption>发布底稿 · f1677dc</figcaption><iframe id="old" title="已发布网站底稿"></iframe></figure></main><script>
const el=id=>document.getElementById(id),baseline=location.protocol+'//'+location.hostname+':8972/',frames={new:el('new'),old:el('old')};let mode='new';
function switchMode(){for(const key of Object.keys(frames)){const frame=frames[key],visible=key===mode||mode==='both';frame.parentNode.hidden=!visible;if(visible&&!frame.dataset.ready){frame.src=(key==='new'?'/':baseline)+el('section').value;frame.dataset.ready='yes';}}document.querySelector('main').classList.toggle('split',mode==='both');document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;switchMode();});el('section').onchange=()=>{for(const frame of Object.values(frames))delete frame.dataset.ready;switchMode();};frames.new.dataset.ready='yes';switchMode();
</script></body></html>
