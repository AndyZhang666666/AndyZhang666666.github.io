name: Portfolio integration and V2 regression
on:
  push:
    branches: [main, feat/squid-lab-entry, design/portfolio-v2-20261109, feat/site-product-depth-20261109]
    paths:
      - 'index.html'
      - 'data.json'
      - 'app.js'
      - 'projects-split.js'
      - 'poker-showcase.js'
      - 'interactions.css'
      - 'motion.js'
      - 'railnav.js'
      - 'academic-art.js'
      - 'assets/**'
      - 'content/**'
      - 'cases/**'
      - 'scripts/case-reader.js'
      - 'scripts/integrate-squid-lab.mjs'
      - 'scripts/test-*.mjs'
      - 'scripts/update-content.mjs'
      - 'scripts/update-selected.mjs'
      - 'scripts/check-portfolio-history.mjs'
      - 'docs/verification/selected-depth-baseline-20261109.json'
      - 'tasteroom/**'
      - 'rag-lab/**'
      - '.github/workflows/squid-entry.yml'
  pull_request:
permissions:
  contents: read
jobs:
  preserve-and-integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Historical display contracts (unchanged tests, approved 828fc59 worktree)
        run: node scripts/check-portfolio-history.mjs
      - name: Current PRD selections, explicit allowed content and all V2 visual protections
        run: node scripts/test-selected-depth.mjs
      - name: Current original V2 and motion ownership contracts
        run: node --test scripts/test-portfolio-v2.mjs scripts/test-motion-policy.mjs
      - name: Current full poster and RAG engine, state, recovery and HTTP safety tests
        run: node --test tasteroom/tests/*.test.mjs rag-lab/tests/*.test.mjs
      - name: Regenerate only the current four product entries and require a clean result
        run: |
          node scripts/update-content.mjs --selected-only
          git diff --exit-code -- index.html data.json app.js cases content/evidence-zh.json content/evidence-en.json docs/verification/selected-depth-generation-20261109.json
      - name: Browser modules (browser-only motion tasks are checked locally, not mocked in CI)
        run: |
          node --check assets/squid-lab-preview.mjs
          node --check assets/showcase-motion.mjs
          node --check assets/motion-governor.mjs
          node --check assets/demo-showcase.mjs
          node --check scripts/test-showcase-motion.mjs
          node --check scripts/preview.mjs
